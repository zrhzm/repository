<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAAAI ^_^</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <a href="index.html" class="logo">
            HAAAI ^_^
        </a>

        <nav class="main-menu">

            <a href="products.html">
                상품
            </a>

            <a href="cart.html">
                장바구니
            </a>

            <a href="payment.html">
                결제수단
            </a>

            <a href="settings.html">
                설정
            </a>

        </nav>

    </header>


    <!-- =========================
         MAIN HERO
    ========================== -->

    <main>

        <section class="hero">

            <!-- 움직이는 배경 -->

            <div class="moving-shape shape-1"></div>
            <div class="moving-shape shape-2"></div>
            <div class="moving-shape shape-3"></div>
            <div class="moving-shape shape-4"></div>


            <!-- 환영 문구 -->

            <div class="welcome">

                <p class="small-label">
                    WELCOME
                </p>

                <h1>
                    HAAAI ^_^
                </h1>

            </div>


            <!-- 버튼 -->

            <div class="hero-buttons">

                <button
                    type="button"
                    class="main-button"
                    id="donationButton"
                >
                    기부
                </button>

                <button
                    type="button"
                    class="main-button"
                    id="jumpscareButton"
                >
                    점프스케어
                </button>

            </div>

        </section>


        <!-- =========================
             DONATION AREA
        ========================== -->

        <section
            class="popup-section"
            id="donationSection"
            hidden
        >

            <div class="popup-content">

                <p class="section-label">
                    DONATION
                </p>


                <div class="donation-image-container">

                    <!-- ==================================
                         DONATION IMAGE HERE

                         나중에 이 부분을 실제 사진으로 교체하세요.

                         예:

                         <img
                             src="assets/images/donation.jpg"
                             alt="기부 이미지"
                         >

                    =================================== -->

                    <div class="image-placeholder">
                        DONATION IMAGE HERE
                    </div>


                    <!-- ==================================
                         DONATION TEXT HERE

                         사진 위에 표시할 글씨를
                         나중에 이 부분에 입력하세요.
                    =================================== -->

                    <div class="donation-overlay">
                        DONATION TEXT HERE
                    </div>

                </div>


                <button
                    type="button"
                    class="close-button"
                >
                    닫기
                </button>

            </div>

        </section>


        <!-- =========================
             JUMPSCARE AREA
        ========================== -->

        <section
            class="popup-section"
            id="jumpscareSection"
            hidden
        >

            <div class="popup-content">

                <p class="section-label">
                    JUMPSCARE
                </p>


                <div class="video-container">

                    <!-- ==================================
                         JUMPSCARE VIDEO HERE

                         나중에 실제 영상으로 교체하세요.

                         예:

                         <video controls>
                             <source
                                 src="assets/videos/jumpscare.mp4"
                                 type="video/mp4"
                             >
                         </video>

                    =================================== -->

                    <div class="video-placeholder">
                        JUMPSCARE VIDEO HERE
                    </div>

                </div>


                <button
                    type="button"
                    class="close-button"
                >
                    닫기
                </button>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

        <p>
            ssunkensh1pp@gmail.com
        </p>

        <p>
            무례하시고 rude하시군요.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
