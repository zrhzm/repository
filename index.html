<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>home</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header">

        <a href="index.html" class="logo">
            home
        </a>

        <nav class="main-menu">

            <button type="button" class="menu-button">
                상품
            </button>

            <button type="button" class="menu-button">
                장바구니
            </button>

            <button type="button" class="menu-button">
                결제수단
            </button>

            <button type="button" class="menu-button">
                설정
            </button>

        </nav>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main>

        <section class="hero">

            <!-- 움직이는 배경 -->

            <div class="moving-shape shape-1"></div>
            <div class="moving-shape shape-2"></div>
            <div class="moving-shape shape-3"></div>
            <div class="moving-shape shape-4"></div>


            <!-- 중앙 콘텐츠 -->

            <div class="hero-center">

                <div class="welcome">

                    <p class="small-label">
                        WELCOME
                    </p>

                    <h1>
                        HAAAI ^_^
                    </h1>

                </div>


                <div class="hero-buttons">

                    <button
                        type="button"
                        class="main-button"
                        id="donationButton"
                    >
                        기부
                    </button>

                    <button
                        type="button"
                        class="main-button"
                        id="jumpscareButton"
                    >
                        점프스케어
                    </button>

                </div>

            </div>

        </section>


        <!-- =========================================
             기부 화면
        ========================================== -->

        <section
            class="fullscreen-overlay"
            id="donationSection"
            hidden
        >

            <div class="overlay-content">

                <div class="donation-image-container">

                    <img
                        src="assets/images/plz.jpg"
                        alt="기부 이미지"
                        class="donation-image"
                    >

                    <!-- DONATION TEXT HERE -->
                    <div class="donation-overlay">
                        DONATION TEXT HERE
                    </div>

                </div>

                <button
                    type="button"
                    class="close-button"
                >
                    닫기
                </button>

            </div>

        </section>


        <!-- =========================================
             점프스케어 화면
        ========================================== -->

        <section
            class="fullscreen-overlay"
            id="jumpscareSection"
            hidden
        >

            <div class="overlay-content">

                <div class="video-container">

                    <!-- JUMPSCARE VIDEO HERE -->

                    <video
                        class="jumpscare-video"
                        controls
                        playsinline
                    >

                        <source
                            src="assets/videos/ohoh.mp4"
                            type="video/mp4"
                        >

                        브라우저에서 영상을 재생할 수 없습니다.

                    </video>

                </div>

                <button
                    type="button"
                    class="close-button"
                >
                    닫기
                </button>

            </div>

        </section>

    </main>


    <!-- =========================================
         홈에서만 표시
    ========================================== -->

    <footer class="site-footer">

        <p>
            ssunkensh1pp@gmail.com
        </p>

        <p>
            무례하시고 rude하시군요.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
