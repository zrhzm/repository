<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>home</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header class="site-header">

    <!-- HOME -->

    <a
        href="index.html"
        class="logo"
    >
        home
    </a>


    <!-- 상단 메뉴 -->

    <nav class="main-menu">

        <button class="menu-button">
            상품
        </button>

        <button class="menu-button">
            장바구니
        </button>

        <button class="menu-button">
            결제수단
        </button>

        <button class="menu-button">
            설정
        </button>

    </nav>

</header>


<main>

    <!-- =====================================
         메인 배경
    ====================================== -->

    <section class="hero">


        <!-- 움직이는 배경 -->

        <div class="moving-shape shape-1"></div>

        <div class="moving-shape shape-2"></div>

        <div class="moving-shape shape-3"></div>

        <div class="moving-shape shape-4"></div>


        <!-- =================================
             환영 문구
        ================================== -->

        <div class="welcome">

            <p class="small-label">
                WELCOME
            </p>

            <h1>
                HAAAI ^_^
            </h1>

        </div>


        <!-- =================================
             버튼
        ================================== -->

        <div class="hero-buttons">

            <button
                type="button"
                class="main-button"
                id="donationButton"
            >
                기부
            </button>


            <button
                type="button"
                class="main-button"
                id="jumpscareButton"
            >
                점프스케어
            </button>

        </div>

    </section>


    <!-- =====================================
         기부 전체화면
    ====================================== -->

    <section
        class="fullscreen-overlay"
        id="donationSection"
        hidden
    >

        <div class="overlay-content">

            <div class="donation-image-container">

                <img
                    src="assets/images/plz.jpg"
                    alt="기부 이미지"
                    class="donation-image"
                >


                <!-- =================================
                     DONATION TEXT HERE

                     사진 위에 넣을 글씨를
                     이 부분에 입력하세요.
                ================================== -->

                <div class="donation-overlay">

                    DONATION TEXT HERE

                </div>

            </div>


            <button
                type="button"
                class="close-button"
            >
                닫기
            </button>

        </div>

    </section>


    <!-- =====================================
         점프스케어 전체화면
    ====================================== -->

    <section
        class="fullscreen-overlay"
        id="jumpscareSection"
        hidden
    >

        <div class="overlay-content">

            <div class="video-container">

                <video
                    class="jumpscare-video"
                    controls
                    playsinline
                >

                    <source
                        src="assets/videos/ohoh.mp4"
                        type="video/mp4"
                    >

                    브라우저에서 영상을 재생할 수 없습니다.

                </video>

            </div>


            <button
                type="button"
                class="close-button"
            >
                닫기
            </button>

        </div>

    </section>

</main>


<!-- =====================================
     홈에서만 표시되는 문구
====================================== -->

<footer class="site-footer">

    <p>
        ssunkensh1pp@gmail.com
    </p>

    <p>
        무례하시고 rude하시군요.
    </p>

</footer>


<!-- =====================================
     메뉴 클릭 시 표시되는 ㅗ
====================================== -->


<script src="script.js"></script>

</body>
</html>
