<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HAAAI ^_^</title>

  <!-- style.css는 index.html과 같은 폴더 -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="site">

    <!-- =========================================
         TOP NAVIGATION
         ========================================= -->
    <header class="top-bar">

      <nav class="top-nav">

        <!-- HOME -->
        <button
          class="nav-button active"
          data-page="home"
          type="button"
        >
          Home
        </button>

        <!-- MENU -->
        <button
          class="nav-button"
          data-page="dummy"
          type="button"
        >
          상품
        </button>

        <button
          class="nav-button"
          data-page="dummy"
          type="button"
        >
          장바구니
        </button>

        <button
          class="nav-button"
          data-page="dummy"
          type="button"
        >
          결제수단
        </button>

        <button
          class="nav-button"
          data-page="dummy"
          type="button"
        >
          설정
        </button>

      </nav>

    </header>


    <!-- =========================================
         PAGE CONTAINER
         ========================================= -->
    <main class="page-container">


      <!-- =========================================
           HOME PAGE
           ========================================= -->
      <section
        id="home-page"
        class="page home-page active-page"
      >

        <!-- BACKGROUND VIDEO -->
        <!-- 배경 영상: videos/background.mp4 -->
        <video
          class="background-video"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          aria-hidden="true"
        >
          <source
            src="videos/background.mp4"
            type="video/mp4"
          >
        </video>

        <div class="background-overlay"></div>


        <!-- HOME CONTENT -->
        <div class="home-content">

          <h1 class="home-title">
            HAAAI ^_^
          </h1>


          <!-- =====================================
               CENTRAL BUTTONS
               ===================================== -->
          <div class="main-buttons">

            <button
              id="donation-button"
              class="main-button"
              type="button"
            >
              <span>기부</span>
            </button>

            <button
              id="jumpscare-button"
              class="main-button"
              type="button"
            >
              <span>점프스케어</span>
            </button>

          </div>

        </div>


        <!-- =====================================
             HOME ONLY FOOTER TEXT
             ===================================== -->
        <div class="home-footer">

          <p>
            ssunkensh1pp@gmail.com
          </p>

          <p>
            무례하시면서도 rude하시군요.
          </p>

        </div>

      </section>



      <!-- =========================================
           DUMMY MENU PAGE
           ========================================= -->
      <section
        id="dummy-page"
        class="page dummy-page"
      >

        <div class="simple-page-content">

          <div class="dummy-symbol">
            ㅗ
          </div>

        </div>

      </section>



      <!-- =========================================
           DONATION PAGE
           ========================================= -->
      <section
        id="donation-page"
        class="page content-page"
      >

        <!-- DONATION IMAGE HERE -->

        <div class="donation-image-wrapper">

<img
    src="images/plz.jpg"
    alt="기부 이미지"
    class="donation-image"
>

          <!-- DONATION TEXT HERE -->

          <div class="donation-text">
            돈주새요<br>
            토스 190854001014
          </div>

        </div>

      </section>



      <!-- =========================================
           JUMPSCARE PAGE
           ========================================= -->
      <section
        id="jumpscare-page"
        class="page content-page"
      >

        <!-- JUMPSCARE VIDEO HERE -->

        <div class="jumpscare-wrapper">

          <video
            id="jumpscare-video"
            class="jumpscare-video"
            controls
            playsinline
            preload="metadata">

            <source
              src="images/ohoh.mp4"
              type="video/mp4">
            </video>
            

          </video>

        </div>

      </section>

    </main>

  </div>


  <!-- script.js는 index.html과 같은 폴더 -->
  <script src="script.js"></script>

</body>
</html>
